x-common: &common
  build: .
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD", "kvctl", "--addr", "localhost:7001", "status"]
    interval: 3s
    timeout: 2s
    retries: 10
services:
  node1:
    <<: *common
    command: ["--id", "node1", "--listen", ":7001", "--raft", ":9001", "--data", "/data", "--bootstrap", "--peers", &peers "node1=node1:9001=localhost:7001,node2=node2:9001=localhost:7002,node3=node3:9001=localhost:7003"]
    ports: ["127.0.0.1:7001:7001"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *common
    command: ["--id", "node2", "--listen", ":7001", "--raft", ":9001", "--data", "/data", "--peers", *peers]
    ports: ["127.0.0.1:7002:7001"]
    volumes: ["node2-data:/data"]
  node3:
    <<: *common
    command: ["--id", "node3", "--listen", ":7001", "--raft", ":9001", "--data", "/data", "--peers", *peers]
    ports: ["127.0.0.1:7003:7001"]
    volumes: ["node3-data:/data"]
volumes:
  node1-data:
  node2-data:
  node3-data:
